name: MSSQL Setup, Build, and Test in Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: self-hosted

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "Swk5-rocks!"
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P Swk5-rocks! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # - name: Start MSSQL Container
      #   run: |
      #     docker run -d --name mssql \
      #       -e ACCEPT_EULA=Y \
      #       -e SA_PASSWORD=Swk5-rocks! \
      #       -p 1433:1433 \
      #       mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for MSSQL to be Ready
        run: |
          echo "Waiting for MSSQL Server to be ready..."
          for i in {1..30}; do
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P Swk5-rocks! -C -Q "SELECT 1" && break
            echo "Waiting..."
            sleep 5
          done

      - name: Initialize Database
        run: |
          echo "Initializing database with init-db.sql..."
          docker cp ./init-db.sql $(docker ps -qf "ancestor=mcr.microsoft.com/mssql/server:2022-latest"):/init-db.sql
          docker exec $(docker ps -qf "ancestor=mcr.microsoft.com/mssql/server:2022-latest") /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P Swk5-rocks! -i /init-db.sql

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release

      - name: Run Tests
        env:
          ConnectionStrings__NextStopDbConnection: "Server=localhost;Database=NextStop;User Id=sa;Password=Swk5-rocks!;Trust Server Certificate=True;"
        run: dotnet test --configuration Release --verbosity normal

      - name: Cleanup MSSQL
        run: |
          echo "Stopping and removing MSSQL container..."
          docker rm -f $(docker ps -qf "ancestor=mcr.microsoft.com/mssql/server:2022-latest")
